name: ai-kernel
# Builds the bare-metal Demo Box kernel and smoke-tests it under QEMU:
# boots, streams 16MB of models through a <=2MB HMM pool, verifies every
# result against CPU references, proves elastic restore — all headless.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build AI-Kernel ELF
        run: |
          make -C kernel/ai-kernel clean
          make -C kernel/ai-kernel

      - name: QEMU smoke test via GRUB (same path as the ISO dual-boot)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            qemu-system-x86 grub-pc-bin grub-common xorriso mtools
          cd kernel/ai-kernel
          make smoke || true
          echo "----- serial output -----"; cat smoke.log 2>/dev/null || true; echo "-------------------------"
          N=$(grep -c -- '-> MATCH' smoke.log || true)
          [ "$N" -eq 7 ] || { echo "expected 7 MATCH (4 init+2 pressure+1 trained), got $N"; exit 1; }
          grep -q "WRITEBACK OK"       smoke.log
          grep -q "\[kv\] OK"         smoke.log
          grep -q "\[scratch\] OK"    smoke.log
          grep -q "SELF-TEST PASS"     smoke.log
          grep -q "elasticity check: returned 128 pages" smoke.log
          echo "AI-KERNEL SMOKE PASS"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-kernel-elf
          path: kernel/ai-kernel/build/ai-kernel.elf
