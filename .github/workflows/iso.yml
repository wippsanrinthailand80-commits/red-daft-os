name: iso
# Builds a REAL bootable Red Daft OS live ISO:
#   kernel.org 7.1.10 (compiled from source) + Debian bookworm rootfs.
# Requires privileged runner (mmdebstrap + kernel build).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    env:
      RD_ARCH: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap squashfs-tools xorriso grub-efi-amd64-bin grub-common \
            mtools debootstrap curl gpg debian-archive-keyring \
            make gcc g++ flex bison libssl-dev libelf-dev bc cpio

      - name: Build Red Daft OS ISO (kernel from source)
        run: sudo -E bash build/build-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: red-daft-os-iso
          path: iso/*.iso
          if-no-files-found: error
